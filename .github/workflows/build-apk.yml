name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # На раннере уже стоит Android SDK (~9 ГБ), но buildozer скачивает свой.
      # Удаляем лишнее, чтобы NDK 28c и сборка не упёрлись в диск.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev
          python3 -m pip install --upgrade pip
          # p4a v2024.01.21 требует Cython 0.29.x и стабильный buildozer.
          python3 -m pip install "buildozer==1.5.0" "cython<3"

      # Для телефона достаточно arm64. Сборка двух архитектур сразу —
      # это двойная компиляция Kivy/Python и лишние гигабайты.
      - name: Build debug APK (arm64)
        run: |
          sed -i 's|^android.archs.*|android.archs = arm64-v8a|' buildozer.spec
          grep -n '^android.archs' buildozer.spec
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electricity-ege-apk-arm64
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
